<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0, private" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>rabota.elistory.ru</title>
    <script>
      // Версия сборки - обновляется автоматически при каждом билде Vite
      (function() {
        var APP_VERSION = '__BUILD_VERSION__';
        var STORED_VERSION = localStorage.getItem('app_version');
        
        // Пропускаем в dev режиме (когда версия не заменена)
        if (APP_VERSION.indexOf('BUILD_VERSION') !== -1) return;
        
        // Функция очистки всех кук
        function clearAllCookies() {
          var cookies = document.cookie.split(";");
          for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i];
            var eqPos = cookie.indexOf("=");
            var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
            name = name.trim();
            // Удаляем куку для всех возможных путей и доменов
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + location.hostname;
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=." + location.hostname;
          }
          console.log('[Cache] Cleared all cookies');
        }
        
        // Если версия изменилась - очищаем всё и перезагружаем
        if (STORED_VERSION && STORED_VERSION !== APP_VERSION) {
          console.log('[Cache] Version changed from', STORED_VERSION, 'to', APP_VERSION);
          
          // 1. Очищаем Cache API
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                caches.delete(name);
                console.log('[Cache] Deleted cache:', name);
              });
            });
          }
          
          // 2. Очищаем все куки
          clearAllCookies();
          
          // 3. Очищаем sessionStorage
          try { sessionStorage.clear(); } catch(e) {}
          
          // 4. Сохраняем новую версию
          localStorage.setItem('app_version', APP_VERSION);
          
          // 5. Принудительная перезагрузка без кеша
          window.location.reload(true);
        } else {
          // Первый визит или версия совпадает - просто сохраняем
          localStorage.setItem('app_version', APP_VERSION);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
