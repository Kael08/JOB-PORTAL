<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0, private" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>rabota.elistory.ru</title>
    <script>
      // Версия сборки - обновляется автоматически при каждом билде Vite
      (function() {
        var APP_VERSION = '__BUILD_VERSION__';
        var STORED_VERSION = localStorage.getItem('app_version');
        
        // Пропускаем в dev режиме
        if (APP_VERSION.indexOf('BUILD_VERSION') !== -1) return;
        
        // Функция очистки всех кук
        function clearAllCookies() {
          document.cookie.split(";").forEach(function(c) {
            var name = c.split("=")[0].trim();
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + location.hostname;
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=." + location.hostname;
          });
        }
        
        // Полная очистка ВСЕГО
        function nukeEverything() {
          console.log('[Cache] FULL CLEAR - nuking everything...');
          
          // 1. Cache API
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          
          // 2. Удаляем ВСЕ Service Workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(registration) {
                registration.unregister();
              });
            });
          }
          
          // 3. Куки
          clearAllCookies();
          
          // 4. sessionStorage
          try { sessionStorage.clear(); } catch(e) {}
          
          // 5. Очищаем ВСЁ в localStorage кроме версии
          var allKeys = Object.keys(localStorage);
          allKeys.forEach(function(key) {
            if (key !== 'app_version') {
              localStorage.removeItem(key);
            }
          });
          localStorage.setItem('app_version', APP_VERSION);
          
          // 6. Редирект сразу, не ждём React (иначе при 404 на JS страница "залипает")
          location.reload();
          return;
        }
        
        // Определяем нужна ли очистка
        var needsClear = false;
        
        if (STORED_VERSION) {
          if (STORED_VERSION !== APP_VERSION) {
            needsClear = true;
          }
        } else {
          // Старый пользователь без app_version - очищаем если есть любые данные
          if (localStorage.length > 0 || document.cookie.length > 0) {
            needsClear = true;
          }
        }
        
        if (needsClear) {
          nukeEverything();
        } else {
          localStorage.setItem('app_version', APP_VERSION);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
